services:
  - type: web
    name: dathoice
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.14.0"
      - key: ELECTRON_SKIP_BINARY_DOWNLOAD
        value: "1"
      - key: DB_PATH
        value: data/colt-express.db
